name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# A push to main publishes the build as a release, which the server pulls,
# and so does a run started by hand on main, which reseals the mail setting.
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The compiler is pinned, so a failure here is the app's own, and moving
      # the pin is a change of its own.
      - name: the pinned kanso
        run: |
          git clone https://github.com/kanso-lang/kanso /tmp/kanso
          cd /tmp/kanso && git checkout "$(cat $GITHUB_WORKSPACE/.kanso-version)"
          cargo build --release
      # `kanso build --release` compiles through clang and links with lld.
      - name: clang and lld
        run: |
          sh /tmp/kanso/scripts/apt_ready.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang-19 lld-19
          sudo ln -sf /usr/bin/clang-19 /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-19 /usr/local/bin/ld.lld
      - name: senro, at the release hako.lock pins
        run: /tmp/kanso/target/release/kanso install .
      - name: the app's tests
        run: |
          senro=$(awk '$1 == "kanso-lang/senro" { print $3 }' hako.lock)
          KANSO=/tmp/kanso/target/release/kanso sh "$HOME/.hako/kanso-lang/senro@$senro/bin/senro" test
      - name: the release build
        run: /tmp/kanso/target/release/kanso build . --release
      - name: the mail setting reaches the server sealed
        run: sh deploy/mail_test.sh
      - name: rows made before owners go to the first confirmed account
        run: sh deploy/owners_test.sh
      # The Gmail secrets, sealed to the key the server publishes, so only the
      # server can read them (deploy/seal_mail.sh, deploy/mail.sh).
      - name: seal the mail setting
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: sh deploy/seal_mail.sh https://178-105-197-4.sslip.io/mail-key.pem deploy/mail.enc
      # The server asks GitHub for the latest release and runs what it holds:
      # the binary, the files it serves, and the service that runs it, with
      # a sha256 so a broken download is never run.
      - name: publish the build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          sealed=""
          [ ! -f deploy/mail.enc ] || sealed=deploy/mail.enc
          tar czf shirabe-linux-x86_64.tar.gz shirabe importmap.json javascript \
            stylesheets vendor public deploy/shirabe.service deploy/mail.sh deploy/owners.sh $sealed
          sha256sum shirabe-linux-x86_64.tar.gz > shirabe-linux-x86_64.tar.gz.sha256
          gh release create "$tag" shirabe-linux-x86_64.tar.gz shirabe-linux-x86_64.tar.gz.sha256 \
            --title "$tag" --notes "Built from $GITHUB_SHA." --latest
